# ============================================================
# COVER LETTER SNIPPETS — Marco Del Fava
# Reusable paragraph blocks pulled into cover letter templates.
#
# Openers use {role} and {company} as format placeholders,
# filled at build time by --role and --company CLI arguments.
# ============================================================

# ── Openers ──────────────────────────────────────────────────────────────────
# One opener per role profile. Selected via profile.cover_letter_opener.
opener:
  neuroengineering: >
    I am applying for the {role} position at {company}. I am a Biomedical
    Engineering M.S. student at UC Davis and build Python software for
    human intracranial electrophysiology in Dr. Jie Zheng's lab at UC Davis Health.

  data_analytics: >
    I am applying for the {role} position at {company}. At First Step
    Communities, I build reporting workflows and analyze service outcomes
    using Python, SQL, and statistical tools.

  clinical_research: >
    I am applying for the {role} position at {company}. My background includes
    neurophysiology research, epilepsy-monitoring volunteer work, and coordinating
    clinical-partner data for homeless-services programs.

# ── Background paragraphs ────────────────────────────────────────────────────
# These are included as body paragraphs in the cover letter template.
# Set a field to "" to suppress it for a given build.

research_background: >
  I work with Neuralynx and Intan recordings, where file metadata, channel
  mapping, and experimental timing affect downstream analysis. I develop
  SpikeInterface processing workflows and align single-unit timestamps with
  narrative events to produce rasters and firing-rate analyses.

projects_background: >
  I built a Neo-backed adapter that makes MED recordings readable in
  SpikeInterface despite malformed channel metadata. In a one-channel comparison
  of 20 million samples, the maximum source-to-MED difference was 0.5 uV,
  with exact agreement after whole-microvolt rounding. During Codex-assisted
  development of Hosaka, I traced a slow CLI operation to repeated schema
  validations, then added content-based caching and regression checks.

data_systems_background: >
  As IT Administrator at First Step Communities, I maintain multi-site
  infrastructure and reporting workflows. I also coordinate clinical-partner
  data collection and explain analytical findings to operational teams.

lab_background: >
  Earlier work in an environmental chemistry laboratory involved analytical
  quality control, data review, and documented procedures.

# ── Closers ───────────────────────────────────────────────────────────────────
closer:
  default: >
    I would be glad to discuss the role and share examples of my work.
    Thank you for your consideration.

  research: >
    I would be glad to discuss your data workflows and walk through the code
    and measurements behind these projects. Thank you for your time.

# Standalone projects separate from work/volunteer roles.
# Add entries here as the pipeline grows.
projects:
  - id: intan
    name: Neural Acquisition and Synchronization
    headline_result: Intan RHD to waveform QA
    dates: 2026
    problem: Connect acquisition files and behavioral event clocks to neural processing.
    tested: Reviewed probe/channel checks and the affine clock-fit implementation; timing logs and bench reports were unavailable.
    bullets:
      - text: Built Intan RHD ingestion, probe/channel checks, and SpikeInterface/Kilosort4 processing with waveform and quality-metric extraction.
        evidence: https://github.com/BarkBarkBarkBarkBarkBarkBark/zlab_sorting_script/blob/3ff216ac593166687ae2260ccb705ea1322cf9f1/notebooks/sort_intan.ipynb
      - text: Implemented queued PsychoPy/RHX event synchronization, exact-label joins, and affine clock fitting to analyze clock drift and alignment residuals.
    maturity: Implemented
    status: Acquisition workflow and clock-alignment software implemented; timing performance not independently verified.
    evidence_ids: [intan-workflow]
    links:
      - label: Intan processing notebook
        url: https://github.com/BarkBarkBarkBarkBarkBarkBark/zlab_sorting_script/blob/3ff216ac593166687ae2260ccb705ea1322cf9f1/notebooks/sort_intan.ipynb
    tags: [neuroengineering, data_acquisition]

  - id: compression
    name: Neural Signal Fidelity and Processing Validation
    headline_result: 0.5 uV max difference across 20 million samples
    dates: 2026
    problem: Evaluate an existing DarkHorse Neuro conversion, not implement its compression algorithm.
    tested: Compared source CSC and reconstructed MED in physical units, then controlled for whole-microvolt rounding before identical offline sorting.
    bullets:
      - text: Evaluated DarkHorse Neuro compression on 20 million samples (one channel, 32 kHz; 625 s); maximum source-to-MED difference was 0.5 uV, with zero mismatches after rounding source values to whole microvolts.
        evidence: https://github.com/BarkBarkBarkBarkBarkBarkBark/DHN_validation/blob/496c2326f000037698f7b92b4b3a4139c3a70d13/sort_med/evidence/8_7_filetype_comparison.ipynb
      - text: Controlled MountainSort5 comparison of rounded inputs preserved all 35,587 spike frames for the compared unit (exact Jaccard 1.0).
        evidence: https://github.com/BarkBarkBarkBarkBarkBarkBark/DHN_validation/blob/496c2326f000037698f7b92b4b3a4139c3a70d13/sort_med/evidence/Strict_Comparison_of_Sorted_Spikes.ipynb
    maturity: Validated
    status: Offline validation on a bounded single-channel slice; archived outputs reviewed, not a new raw-data rerun.
    evidence_ids: [dhn-fidelity, dhn-spike-control]
    links:
      - label: Waveform fidelity evidence
        url: https://github.com/BarkBarkBarkBarkBarkBarkBark/DHN_validation/blob/496c2326f000037698f7b92b4b3a4139c3a70d13/sort_med/evidence/8_7_filetype_comparison.ipynb
      - label: Controlled spike comparison
        url: https://github.com/BarkBarkBarkBarkBarkBarkBark/DHN_validation/blob/496c2326f000037698f7b92b4b3a4139c3a70d13/sort_med/evidence/Strict_Comparison_of_Sorted_Spikes.ipynb
    tags: [neuroengineering, compression, signal_processing]

  - id: sorting
    name: Spike Sorting and Waveform Discrimination
    headline_result: 38,145 snippets across 10 putative unit labels
    dates: 2026
    problem: Quantify waveform-feature behavior against reference unit assignments.
    tested: Evaluated event-family WeightBank activations with nearest-neighbor purity and KMeans label matching on curated snippets.
    bullets:
      - text: Implemented waveform-feature evaluation across 38,145 spike snippets and 10 putative O-Sort unit labels; event-family KNN purity at k=5 was 95.04%.
        evidence: https://github.com/BarkBarkBarkBarkBarkBarkBark/spike_discrim/blob/a697e68898c688ccc5dfe23ced78dbc6494ca1c1/docs/clustering_results.md
      - text: Measured 54.26% Hungarian-matched KMeans accuracy (ARI 0.3665) for that feature family; neighborhood purity is not sorter accuracy or biological ground truth.
        evidence: https://github.com/BarkBarkBarkBarkBarkBarkBark/spike_discrim/blob/a697e68898c688ccc5dfe23ced78dbc6494ca1c1/src/spike_discrim/benchmarking/afferent_clustering.py
    maturity: Validated
    status: Offline feature validation; streaming detection and competitive-learning sorting in SNNeuro remain prototypes.
    evidence_ids: [waveform-features]
    links:
      - label: Discrimination results
        url: https://github.com/BarkBarkBarkBarkBarkBarkBark/spike_discrim/blob/a697e68898c688ccc5dfe23ced78dbc6494ca1c1/docs/clustering_results.md
      - label: O-Sort membership comparison
        url: https://github.com/BarkBarkBarkBarkBarkBarkBark/osort_medd_comparison/blob/4d5e94e7c3a637e9efdda8e35d7a8c0494f20a1d/codes/compare_osort_membership.m
      - label: Streaming prototype
        url: https://github.com/BarkBarkBarkBarkBarkBarkBark/SNNeuro/blob/c2eecb76d4d47ad4966ee117e10fd9585e0f48a8/src/snn_agent/core/pipeline.py
    tags: [neuroengineering, spike_sorting]

  - id: semantic
    name: Single-neuron analysis and adaptive-search development
    dates: 2026
    problem: Develop reproducible stimulus-response software before adaptive experiments.
    bullets:
      - text: Implemented a seeded NEURON prototype mapping sentence similarity to stochastic input rates, with fixed synaptic weights.
        evidence: https://github.com/BarkBarkBarkBarkBarkBarkBark/semantic_neuron/blob/349fe4be084a5b49b4b2037995a137ee6f83994b/neuronlib.py
      - text: Added seeded stimulus windows, presynaptic event recording, voltage traces, and output spike times for reproducible simulated response analysis.
        evidence: https://github.com/BarkBarkBarkBarkBarkBarkBark/semantic_neuron/blob/349fe4be084a5b49b4b2037995a137ee6f83994b/neuronlib.py
    maturity: Prototype
    status: Simulation implemented; adaptive human stimulus selection and semantic selectivity are not validated.
    evidence_ids: [semantic-simulation]
    links:
      - label: Simulation implementation
        url: https://github.com/BarkBarkBarkBarkBarkBarkBark/semantic_neuron/blob/349fe4be084a5b49b4b2037995a137ee6f83994b/neuronlib.py
    tags: [neuroengineering, semantic]

  - id: neuralynx
    name: Supporting acquisition work - Neuralynx / Dark Horse Neuro
    dates: 2026
    problem: Configure acquisition sessions and replay archived Neuralynx recordings.
    bullets:
      - text: Implemented DHN-AQ RC/CS configuration writers and SSH launch orchestration.
        evidence: https://github.com/BarkBarkBarkBarkBarkBarkBark/dhn_client/tree/c4b0420a2f43aaca2367a7034a5deef7019528ee/src/darkhorse_neuralynx/dhn_client
      - text: Developed an NRD-to-UDP replay prototype for DHN-AQ ingestion.
        evidence: https://github.com/BarkBarkBarkBarkBarkBarkBark/dhn_client/blob/c4b0420a2f43aaca2367a7034a5deef7019528ee/src/darkhorse_neuralynx/pegasus_bridge/nrd_stream.py
    maturity: Prototype
    status: Prototype implemented; hardware reception and recording validation remain in progress.
    evidence_ids: [dhn-acquisition]
    links:
      - label: Acquisition implementation
        url: https://github.com/BarkBarkBarkBarkBarkBarkBark/dhn_client/tree/c4b0420a2f43aaca2367a7034a5deef7019528ee/src/darkhorse_neuralynx
    tags: [neuroengineering, data_acquisition]


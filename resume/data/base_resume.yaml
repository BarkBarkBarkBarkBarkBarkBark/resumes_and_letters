# Standalone projects separate from work/volunteer roles.
# Add entries here as the pipeline grows.
projects:
  - id: intan
    name: Intan acquisition and experiment synchronization
    dates: 2026
    problem: Connect neural recordings to reproducible processing and experiment timing.
    bullets:
      - text: Implemented Intan RHD loading, probe configuration, and SpikeInterface/Kilosort4 processing in zlab_sorting_script.
        evidence: https://github.com/BarkBarkBarkBarkBarkBarkBark/zlab_sorting_script/blob/main/notebooks/sort_intan.ipynb
      - text: Developing Intan RHX/DeepArray acquisition and event-synchronization integration; hardware bench validation remains pending.
    status: File-processing workflow implemented; live acquisition and timing integration in progress.
    links:
      - label: Intan workflow
        url: https://github.com/BarkBarkBarkBarkBarkBarkBark/zlab_sorting_script/blob/main/readme.md
    tags: [neuroengineering, data_acquisition]

  - id: sorting
    name: Waveform discrimination and online sorting research
    dates: 2026
    problem: Preserve unit-specific waveform information while investigating streaming analysis.
    bullets:
      - text: Implemented WeightBank waveform representations in spike_discrim; evaluated post-hoc clustering against putative O-Sort unit labels.
        evidence: https://github.com/BarkBarkBarkBarkBarkBarkBark/spike_discrim/blob/main/docs/clustering_results.md
      - text: Developed synthetic streaming/detection infrastructure in realtime-sorter-mvp and experimental competitive-learning sorting in SNNeuro.
        evidence: https://github.com/BarkBarkBarkBarkBarkBarkBark/SNNeuro/blob/main/src/snn_agent/core/pipeline.py
    status: Discrimination evaluated offline; online unit sorting remains experimental, without validated end-to-end latency.
    links:
      - label: Discrimination results
        url: https://github.com/BarkBarkBarkBarkBarkBarkBark/spike_discrim/blob/main/docs/clustering_results.md
      - label: Streaming, not unit sorting
        url: https://github.com/BarkBarkBarkBarkBarkBarkBark/realtime-sorter-mvp
      - label: Experimental sorter
        url: https://github.com/BarkBarkBarkBarkBarkBarkBark/SNNeuro/blob/main/src/snn_agent/core/dec_layer.py
    tags: [neuroengineering, spike_sorting]

  - id: semantic
    name: Single-neuron response analysis and semantic tuning
    dates: 2026
    problem: Investigate relationships between stimulus meaning and single-neuron responses.
    bullets:
      - text: Implemented a seeded NEURON prototype mapping sentence similarity to stochastic input rates, with fixed synaptic weights.
        evidence: https://github.com/BarkBarkBarkBarkBarkBarkBark/semantic_neuron/blob/main/neuronlib.py
      - text: Developed semantic-trajectory tooling in ZEmbeddings; exploring stimulus-aligned response analysis and adaptive stimulus selection.
        evidence: https://github.com/BarkBarkBarkBarkBarkBarkBark/ZEmbeddings/tree/main/src/zembeddings
    status: Simulation and text analysis implemented; adaptive experiments proposed, not demonstrated human concept selectivity or causality.
    links:
      - label: Simulation and limitations
        url: https://github.com/BarkBarkBarkBarkBarkBarkBark/semantic_neuron#limitations
      - label: Semantic text analysis
        url: https://github.com/BarkBarkBarkBarkBarkBarkBark/ZEmbeddings
    tags: [neuroengineering, semantic]

  - id: neuralynx
    name: Supporting acquisition work - Neuralynx / Dark Horse Neuro
    dates: 2026
    problem: Configure acquisition sessions and replay archived Neuralynx recordings.
    bullets:
      - text: Implemented DHN-AQ RC/CS configuration writers and SSH launch orchestration.
        evidence: https://github.com/BarkBarkBarkBarkBarkBarkBark/dhn_client/tree/main/src/darkhorse_neuralynx/dhn_client
      - text: Developed an NRD-to-UDP replay prototype for DHN-AQ ingestion.
        evidence: https://github.com/BarkBarkBarkBarkBarkBarkBark/dhn_client/blob/main/src/darkhorse_neuralynx/pegasus_bridge/nrd_stream.py
    status: Prototype implemented; hardware reception and recording validation remain in progress.
    links:
      - label: Acquisition implementation
        url: https://github.com/BarkBarkBarkBarkBarkBarkBark/dhn_client
    tags: [neuroengineering, data_acquisition]


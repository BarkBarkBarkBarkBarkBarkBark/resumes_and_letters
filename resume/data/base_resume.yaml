# Standalone projects separate from work/volunteer roles.
# Add entries here as the pipeline grows.
projects:
  - id: intan
    name: Neural Acquisition and Experimental Synchronization
    dates: 2026
    problem: Connect neural recordings to the experimental events needed to interpret them.
    tools: Python, Intan RHD/RHX, PsychoPy, SpikeInterface, Kilosort4
    bullets:
      - text: >
          Built Python workflows for processing Intan recordings through
          SpikeInterface, including probe mapping, channel checks, spike sorting,
          waveform extraction, and quality metrics.
        evidence: https://github.com/BarkBarkBarkBarkBarkBarkBark/zlab_sorting_script/blob/3ff216ac593166687ae2260ccb705ea1322cf9f1/notebooks/sort_intan.ipynb
      - text: >
          Developed synchronization software to align PsychoPy behavioral events
          with RHX recordings, using matched event labels and affine clock fitting
          to characterize drift between recording systems.
    evidence_ids: [intan-workflow]
    links:
      - label: Processing notebook
        url: https://github.com/BarkBarkBarkBarkBarkBarkBark/zlab_sorting_script/blob/3ff216ac593166687ae2260ccb705ea1322cf9f1/notebooks/sort_intan.ipynb
    tags: [neuroengineering, data_acquisition]

  - id: compression
    name: Neural Data Formats and Integrity
    dates: 2026
    problem: Make vendor recordings readable and check what changes during conversion.
    tools: Python, NumPy, Neo, SpikeInterface, Neuralynx CSC, DarkHorse MED
    bullets:
      - text: >
          Adapted a Neo-backed MED reader to skip corrupt parity channels whose
          metadata caused standard readers to abort, allowing processing without
          modifying source recordings.
        evidence: https://github.com/BarkBarkBarkBarkBarkBarkBark/DHN_validation/blob/496c2326f000037698f7b92b4b3a4139c3a70d13/sort_med/sorting_tools/med_utils.py
        tags: [compact]
      - text: >
          Developed validation and repair utilities for Neuralynx recordings with
          sample-count inconsistencies and missing recording-end metadata that
          prevented downstream conversion.
      - text: >
          Evaluated signal fidelity across 20 million samples on one channel
          (32 kHz; 625 s), comparing original CSC and compressed MED recordings.
          Measured a maximum amplitude difference of 0.5 µV, with exact agreement
          after whole-microvolt source rounding.
        evidence: https://github.com/BarkBarkBarkBarkBarkBarkBark/DHN_validation/blob/496c2326f000037698f7b92b4b3a4139c3a70d13/sort_med/evidence/8_7_filetype_comparison.ipynb
        tags: [compact]
    evidence_ids: [med-adapter, neuralynx-repair, dhn-fidelity, dhn-spike-control]
    links:
      - label: Reader code
        url: https://github.com/BarkBarkBarkBarkBarkBarkBark/DHN_validation/blob/496c2326f000037698f7b92b4b3a4139c3a70d13/sort_med/sorting_tools/med_utils.py
      - label: Validation notebook
        url: https://github.com/BarkBarkBarkBarkBarkBarkBark/DHN_validation/blob/496c2326f000037698f7b92b4b3a4139c3a70d13/sort_med/evidence/8_7_filetype_comparison.ipynb
    tags: [neuroengineering, compression, signal_processing]

  - id: saw
    name: Scientific AI Workstation - Agent-Assisted Scientific Software
    headline_result: Approval-gated agent edits and validation-oriented tooling
    dates: 2026
    problem: Give coding agents controlled access to inspect and modify research software.
    tested: Public implementation inspected; no independent runtime, security, or performance evaluation.
    bullets:
      - text: Developed a local-first scientific workflow workbench combining Python APIs, React/TypeScript, and tool-calling coding-agent integration.
        evidence: https://github.com/BarkBarkBarkBarkBarkBarkBark/Scientific-A.I.-Workstation/blob/c1cc2c5ae9d3c86a3479b89a03b53234060b5f7b/services/saw_api/app/agent_runtime/core.py
      - text: Implemented approval-gated edits, configurable file capabilities, and validation/rollback pathways through a separate patch-engine service.
        evidence: https://github.com/BarkBarkBarkBarkBarkBarkBark/Scientific-A.I.-Workstation/blob/c1cc2c5ae9d3c86a3479b89a03b53234060b5f7b/services/patch_engine/app/main.py
    maturity: Prototype
    status: Local-first development prototype; runtime reliability and security not independently validated.
    evidence_ids: [saw-agent-workflow]
    links:
      - label: Scientific AI Workstation source
        url: https://github.com/BarkBarkBarkBarkBarkBarkBark/Scientific-A.I.-Workstation
    tags: [technical, python, agentic, software_engineering]

  - id: sorting
    name: Waveform Analysis and Spike Sorting
    dates: 2026
    problem: Compare waveform representations for separating putative neural units.
    tools: Python, NumPy, scikit-learn, O-Sort
    bullets:
      - text: >
          Evaluated waveform representations across 38,145 spike snippets and
          10 putative O-Sort unit labels, comparing how well different features
          preserved local waveform structure and supported clustering.
        evidence: https://github.com/BarkBarkBarkBarkBarkBarkBark/spike_discrim/blob/a697e68898c688ccc5dfe23ced78dbc6494ca1c1/docs/clustering_results.md
      - text: >
          Found that strong local neighbor consistency did not translate into
          equivalent global clustering agreement, distinguishing local waveform-feature
          consistency from whole-dataset clustering behavior.
        evidence: https://github.com/BarkBarkBarkBarkBarkBarkBark/spike_discrim/blob/a697e68898c688ccc5dfe23ced78dbc6494ca1c1/src/spike_discrim/benchmarking/afferent_clustering.py
    evidence_ids: [waveform-features]
    links:
      - label: Technical report
        url: https://github.com/BarkBarkBarkBarkBarkBarkBark/spike_discrim/blob/a697e68898c688ccc5dfe23ced78dbc6494ca1c1/docs/clustering_results.md
    tags: [neuroengineering, spike_sorting]

  - id: hosaka
    name: Debugging Agent-Generated Software
    dates: 2026
    problem: Find and fix a slow CLI operation introduced during Codex-assisted development.
    tools: Python, Codex, timing instrumentation, content-based caching, regression tests
    bullets:
      - text: >
          Investigated a performance regression in Hosaka, a command-line software
          platform, where agent-generated schema validation made listing seven
          records take approximately ten seconds.
      - text: >
          Used execution timing logs to identify repeated validation as the
          bottleneck, then introduced content-based caching and regression tests
          to preserve checks for changed or invalid schemas.
    evidence_ids: [hosaka-debugging]
    links: []
    tags: [technical, python, debugging]

  - id: semantic
    name: Single-neuron analysis and adaptive-search development
    dates: 2026
    problem: Develop reproducible stimulus-response software before adaptive experiments.
    bullets:
      - text: Implemented a seeded NEURON prototype mapping sentence similarity to stochastic input rates, with fixed synaptic weights.
        evidence: https://github.com/BarkBarkBarkBarkBarkBarkBark/semantic_neuron/blob/349fe4be084a5b49b4b2037995a137ee6f83994b/neuronlib.py
      - text: Added seeded stimulus windows, presynaptic event recording, voltage traces, and output spike times for reproducible simulated response analysis.
        evidence: https://github.com/BarkBarkBarkBarkBarkBarkBark/semantic_neuron/blob/349fe4be084a5b49b4b2037995a137ee6f83994b/neuronlib.py
    evidence_ids: [semantic-simulation]
    links:
      - label: Simulation implementation
        url: https://github.com/BarkBarkBarkBarkBarkBarkBark/semantic_neuron/blob/349fe4be084a5b49b4b2037995a137ee6f83994b/neuronlib.py
    tags: [neuroengineering, semantic]

  - id: neuralynx
    name: Supporting acquisition work - Neuralynx / Dark Horse Neuro
    dates: 2026
    problem: Configure acquisition sessions and replay archived Neuralynx recordings.
    bullets:
      - text: Implemented DHN-AQ RC/CS configuration writers and SSH launch orchestration.
        evidence: https://github.com/BarkBarkBarkBarkBarkBarkBark/dhn_client/tree/c4b0420a2f43aaca2367a7034a5deef7019528ee/src/darkhorse_neuralynx/dhn_client
      - text: Developed an NRD-to-UDP replay prototype for DHN-AQ ingestion.
        evidence: https://github.com/BarkBarkBarkBarkBarkBarkBark/dhn_client/blob/c4b0420a2f43aaca2367a7034a5deef7019528ee/src/darkhorse_neuralynx/pegasus_bridge/nrd_stream.py
    evidence_ids: [dhn-acquisition]
    links:
      - label: Acquisition implementation
        url: https://github.com/BarkBarkBarkBarkBarkBarkBark/dhn_client/tree/c4b0420a2f43aaca2367a7034a5deef7019528ee/src/darkhorse_neuralynx
    tags: [neuroengineering, data_acquisition]


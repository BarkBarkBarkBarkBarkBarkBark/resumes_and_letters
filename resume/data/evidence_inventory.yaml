        location: Nearest-neighbor purity implementation
    public: true
    maturity: Validated
    verification: Report checked against metric implementation; source waveform snippets not downloaded or reprocessed.
    measurement_definition: KNN-k5 purity is mean same-label neighbor fraction, excluding self. Matched accuracy uses Hungarian cluster-to-label assignment. ARI is chance-corrected clustering agreement.
    test_conditions: 38,145 spike snippets; 10 putative O-Sort labels; tier-3 features; event-family WeightBank with 10 bins, sigma_scale 1.0, threshold 0.5; KMeans 10 clusters, n_init 10, seed 42.
    verified_result: "Event family: KNN-k5 purity 0.9504; matched clustering accuracy 0.5426; ARI 0.3665."
    values:
      spike_snippets: 38145
      putative_units: 10
      knn_k: 5
      knn_purity: 0.9504
      matched_accuracy: 0.5426
      ari: 0.3665
      families:
        - {name: event, knn_purity: 0.9504, matched_accuracy: 0.5426, ari: 0.3665}
        - {name: scalar, knn_purity: 0.9123, matched_accuracy: 0.5406, ari: 0.3974}
        - {name: full, knn_purity: 0.9572, matched_accuracy: 0.5365, ari: 0.4046}
        - {name: temporal_mad, knn_purity: 0.8367, matched_accuracy: 0.4301, ari: 0.3125}
    limitations: Offline label-agreement analysis, not held-out classification accuracy, biological ground truth, or online sorting validation. Class imbalance and curated-snippet selection limit generalization.
    visual:
      kind: metrics
      figure_id: C3
      title: Local separability is not clustering agreement
      caption: Event-family features; 38,145 curated snippets and 10 putative O-Sort labels. These metric definitions differ; ARI is chance-corrected, not a percentage or biological accuracy.
      comparison_title: Same-metric comparison across feature families
      evidence_gap: Assignment counts and permission-safe waveform/features were not available for this publication. C1 waveform/projection and C2 contingency figures are withheld, not reconstructed from aggregate scores.


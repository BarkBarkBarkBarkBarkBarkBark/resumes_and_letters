    measurement_definition: Ordinary least-squares affine fit of relative RHX sample indices against monotonic flip-callback time. Signed residual = (observed sample - fitted sample) / fitted slope * 1000. P95 and maximum operate on absolute residuals; P95 uses linear interpolation.
    test_conditions: Nominal sample rate passed as an argument; fitted slope used for residual conversion; exact trial-name joins.

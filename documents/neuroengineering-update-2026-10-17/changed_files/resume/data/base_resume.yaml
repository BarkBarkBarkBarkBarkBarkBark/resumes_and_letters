# Standalone projects separate from work/volunteer roles.
# Add entries here as the pipeline grows.
projects:
  - name: Single-unit response analysis and semantic tuning
    dates: 2026
    bullets:
      - Built event-aligned PSTH analysis for a dataset of 10 participants hearing
        seven 30-second stories six times each; examined response consistency
        across repeated presentations.
      - Use repeat-responsive units as reference cases for pipeline checks while
        developing adaptive stimulus selection to characterize semantic tuning.
    tags: [neuroengineering, research, technical, signal_processing, python, validation, semantic, software, data]

  - name: Semantic Neuron simulation
    dates: 2026
    bullets:
      - Built a NEURON prototype linking sentence-embedding cosine similarity to
        stochastic synaptic input in a Hodgkin-Huxley compartment with fixed
        synaptic weights.
      - Implemented seeded trials and outputs for membrane voltage, presynaptic
        and postsynaptic spike times, and firing rates to explore semantic-tuning
        hypotheses in simulation.
    links:
      - label: GitHub
        url: https://github.com/BarkBarkBarkBarkBarkBarkBark/semantic_neuron
    tags: [neuroengineering, research, technical, signal_processing, python, semantic, simulation]

  - name: Dark Horse Neuro / Neuralynx acquisition pipeline
    dates: 2026
    bullets:
      - Develop Python orchestration for DHN-AQ configuration, SSH launch,
        acquisition diagnostics, and Neuralynx Pegasus/NetCom integration.
      - Implemented RC/CS configuration writers and an NRD-to-UDP replay
        prototype; hardware reception and recording validation remain in progress.
    links:
      - label: GitHub
        url: https://github.com/BarkBarkBarkBarkBarkBarkBark/dhn_client
      - label: Docs
        url: https://barkbarkbarkbarkbarkbarkbark.github.io/dhn_client/
    tags: [neuroengineering, research, technical, data_acquisition, compression, signal_processing, python, software, data]

  - name: spike_discrim single-unit DSP workbench
    dates: 2026
    bullets:
      - Prototyped low-latency waveform representations for real-time single-unit
        discrimination using curated OSort snippets, synthetic data, AUC,
        balanced accuracy, mutual information, and KNN purity.
      - Built a Numba-accelerated WeightBank population code to score
        spike-likeness and project waveforms into afferent activation space for
        clustering and unit-separation analysis.
    links:
      - label: GitHub
        url: https://github.com/BarkBarkBarkBarkBarkBarkBark/spike_discrim
    tags: [neuroengineering, research, technical, spike_sorting, signal_processing, ml, realtime]

  - name: SNN Agent real-time spike sorting
    dates: 2026
    bullets:
      - Developed an experimental streaming spiking neural network with bandpass filtering,
        Kalman noise gating, competitive STDP, and browser-based monitoring for
        spike detection and sorting.
      - Explore synthetic and recorded-data inputs for online sorting research;
        clinical closed-loop performance and latency targets remain unvalidated.
    links:
      - label: GitHub
        url: https://github.com/BarkBarkBarkBarkBarkBarkBark/SNNeuro
    tags: [neuroengineering, research, technical, spike_sorting, signal_processing, ml, realtime]


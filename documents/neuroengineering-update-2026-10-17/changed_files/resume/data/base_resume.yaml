summary:
  neuroengineering: >
    Biomedical Engineering M.S. student at UC Davis working on human single-unit
    electrophysiology, neural acquisition, and Python analysis pipelines.
    Experience spans Intan/DeepArray bench testing, Neuralynx and Dark Horse Neuro
    workflows, spike sorting, experiment synchronization, and event-aligned
    response analysis. Develops tools with AI coding agents and evaluates outputs
    against recorded signals, timing measurements, and reproducible neural responses.

  neural_data: >
    Scientific software developer and UC Davis Biomedical Engineering M.S. student
    building Python tools for human intracranial recordings. Works across
    Neuralynx/MED data handling, SpikeInterface preprocessing and sorting,
    behavioral-event alignment, and single-unit response analysis. Uses recorded
    data and repeatable response patterns to evaluate AI-assisted implementations,
    with ongoing development toward streaming neural interpretation.

  acquisition_validation: >
    UC Davis Biomedical Engineering M.S. student with hands-on neural acquisition
    bench testing and a professional background in laboratory quality control
    and technical operations. Works with Intan/DeepArray, Neuralynx, and Dark Horse

# ============================================================
# COVER LETTER SNIPPETS — Marco Del Fava
# Reusable paragraph blocks pulled into cover letter templates.
#
# Openers use {role} and {company} as format placeholders,
# filled at build time by --role and --company CLI arguments.
# ============================================================

# ── Openers ──────────────────────────────────────────────────────────────────
# One opener per role profile. Selected via profile.cover_letter_opener.
opener:
  neuroengineering: >
    I am applying for the {role} position at {company}. I am a Biomedical
    Engineering M.S. student at UC Davis working in Dr. Jie Zheng's lab on
    human single-unit recordings, neural acquisition, and Python analysis tools.
    I want to contribute to the engineering that connects a recording system
    to reliable experimental results.

  neural_data: >
    I am applying for the {role} position at {company}. My work in Dr. Jie
    Zheng's lab at UC Davis connects human intracranial recordings with Python
    preprocessing, spike sorting, event alignment, and single-unit response
    analysis. As a Biomedical Engineering M.S. student, I am developing toward
    scientific software roles where the correctness of a data pipeline matters
    as much as its implementation.

  acquisition_validation: >
    I am applying for the {role} position at {company}. I bring hands-on neural
    acquisition bench testing in Dr. Jie Zheng's lab at UC Davis, a Biomedical
    Engineering M.S. focus in neuroengineering, and professional experience in
    laboratory quality control and technical operations. I am particularly
    interested in acquisition integration, troubleshooting, and test engineering.

  data_analytics: >
    I am writing to apply for the {role} position at {company}. With five years of
    experience building outcomes measurement infrastructure for homeless services
    programs, and strong technical skills in Python, SQL, and statistical analysis,
    I am prepared to contribute immediately to your data and evaluation work.

  clinical_research: >
    I am writing to apply for the {role} position at {company}. With clinical
    volunteer experience in neurophysiology and epilepsy monitoring units, CITI
    research certifications, and five years working alongside people experiencing
    severe mental illness and housing instability, I bring both technical and
    human-centered skills to clinical research teams.

# ── Background paragraphs ────────────────────────────────────────────────────
# These are included as body paragraphs in the cover letter template.
# Set a field to "" to suppress it for a given build.

research_background: >
  I co-led bench testing of a 128-channel DeepArray/Intan setup, mapping probe
  and RHX channels and investigating grounding, filter behavior, shorts, and
  high-impedance channels. Our lab testing identified 121 channels with clean
  test-signal recordings. I also work on PsychoPy/RHX event synchronization
  using TCP annotations and Cedrus C-Pod TTL markers, with measurements of
  clock drift and event-alignment residuals.

projects_background: >
  On the analysis side, I built a Python workflow combining sorted units and
  event markers to generate PSTHs for repeated stories, reproducing a response
  in the same unit across six presentations. I also built a NEURON prototype
  linking semantic similarity to stochastic synaptic input, and I develop
  Neuralynx/Dark Horse Neuro orchestration and replay tools. Streaming
  interpretation and adaptive semantic screening are my current development
  direction.

validation_background: >
  I use AI coding agents to accelerate implementation and check the results
  against recorded signals, timing measurements, and repeatable responses.
  This gives me concrete ways to investigate whether a pipeline preserves
  the experimental information it is intended to measure.

data_systems_background: >
  As operations specialist and data analyst for First Step Communities, I built
  analytical pipelines to evaluate housing and health outcomes across 4 shelter
  sites serving 400+ people/month. I coordinated data collection from clinical
  partners, disaggregated outcomes by demographic characteristics to surface
  equity-relevant findings, and produced evidence that informed partnerships with
  UC Davis, Kaiser, and other healthcare providers.

lab_background: >
  Earlier work at Eurofins Test America developed my laboratory documentation
  and quality-control habits. At First Step Communities, I build data workflows
  and support technical systems across multiple sites, translating operational
  requirements into tools colleagues can use.

# The lab paragraph above already includes the transferable professional work.
# Keep the longer analytics paragraph for the analytics profile only.
profile_overrides:
  neuroengineering:
    data_systems_background: ""
  neural_data:
    research_background: >
      I process human microwire recordings with SpikeInterface, MountainSort5,
      Kilosort4, and O-Sort, and compare Neuralynx CSC and MED-derived inputs
      to investigate conversion precision and spike-detection discrepancies.
      My Python event-analysis workflow combines sorted units with event markers
      to generate PSTHs and examine response consistency across repeated stories.
    projects_background: >
      I develop Python orchestration for Dark Horse Neuro acquisition, including
      configuration writers, SSH launch tooling, diagnostics, and an NRD-to-UDP
      replay prototype. I also built a seeded NEURON semantic-tuning simulation.
      These projects support my progression toward streaming interpretation;
      full acquisition/replay validation remains in progress.
    data_systems_background: ""
  acquisition_validation:
    projects_background: >
      My analysis work connects sorted neural data and event markers to PSTHs,
      allowing me to check whether repeated responses are recovered through
      the pipeline. I also develop Python configuration, launch, and diagnostic
      tooling for Neuralynx/Dark Horse Neuro workflows, with recording and
      replay validation still in progress.
    data_systems_background: ""
  data_analytics:
    lab_background: >
      Earlier work in a high-throughput environmental laboratory developed my
      documentation and quality-control habits.
  clinical_research:
    research_background: >
      In Dr. Jie Zheng's lab at UC Davis Health, I work with human intracranial
      recordings, single-unit analysis, and experiment synchronization. I have
      also supported EEG preparation and observed neurophysiology procedures
      in UC Davis Health's Epilepsy Monitoring Unit.
    projects_background: ""
    validation_background: ""

# ── Closers ───────────────────────────────────────────────────────────────────
closer:
  default: >
    I would be honored to contribute my skills to your team and look forward to the
    opportunity to discuss how my background can support your work. Thank you for
    your consideration.

  research: >
    I would welcome a discussion of how my acquisition, analysis, and validation
    experience could support your team. Thank you for your consideration.

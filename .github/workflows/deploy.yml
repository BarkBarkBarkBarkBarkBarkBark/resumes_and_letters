name: Build and Deploy Portfolio and CV

on:
  push:
    branches: [main]
  workflow_dispatch:      # allows manual trigger from the Actions tab

# Required for the deploy-pages action
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; cancel in-flight runs on new push
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # ── Build ────────────────────────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: resume/requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r resume/requirements.txt

      - name: Install Pandoc and LuaLaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc latexmk texlive-luatex texlive-fonts-recommended texlive-latex-extra poppler-utils

      - name: Test generator
        run: python -m pytest resume/tests -q

      - name: Build portfolio and matching PDF from this commit
        run: python resume/scripts/build_site.py --profile neuroengineering --output-dir _site --source-commit "$GITHUB_SHA"

      - name: Verify two-page PDF, margins, reading order, and evidence links
        env:
          PORTFOLIO_DIR: _site
        run: python -m pytest resume/tests/test_pdf.py -q

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # ── Deploy ───────────────────────────────────────────────────────────────────
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
